# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.2"

package:
  name: pymilvus
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pymilvus/pymilvus-${{ version }}.tar.gz
  sha256: 607ac1bcc96719c1716e0027d4a59c6411ad783fb934cbe0618b6d6c0831550d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.27,<1.28
    # setuptools_scm[toml] needs nothing extra on conda-forge
    - setuptools-scm >=8
    - vcs_versioning <2
  run:
    - python >=${{ python_min }}
    # tightest of upstream's floors (python >=3.14) and exclusions (python <3.14)
    - grpcio >=1.75.1,!=1.68.0,!=1.68.1,!=1.69.0,!=1.70.0,!=1.70.1,!=1.71.0,!=1.72.1,!=1.73.0
    - orjson >=3.10.15
    - protobuf >=5.27.2
    - python-dotenv >=1.0.1,<2.0.0
    - pandas >=1.2.4
    - cachetools >=5.0.0
    - requests >=2.20.0

tests:
  - python:
      imports: pymilvus
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pymilvus
  repository: https://github.com/milvus-io/pymilvus
  summary: Python Sdk for Milvus
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ndmaxar
    - oblute
    - rluria14
    - xylar
    - bollwyvl
